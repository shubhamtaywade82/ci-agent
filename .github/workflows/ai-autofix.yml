name: ai-autofix
on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  autofix:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0] != null && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check GitHub App credentials
        id: app-credentials
        env:
          APP_ID: ${{ vars.CI_AGENT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_AGENT_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create short-lived GitHub App token
        id: app-token
        if: steps.app-credentials.outputs.configured == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_AGENT_APP_ID }}
          private-key: ${{ secrets.CI_AGENT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
      - name: Diagnose failure and create a draft fix PR
        if: steps.app-token.outputs.token != ''
        uses: ./
        with:
          mode: fix
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          workflow-run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL_FIX: ${{ vars.OLLAMA_MODEL_FIX }}
      - name: Explain why autofix was skipped
        if: steps.app-credentials.outputs.configured != 'true'
        run: echo "::notice::Autofix skipped. Configure CI_AGENT_APP_ID and CI_AGENT_APP_PRIVATE_KEY; default GITHUB_TOKEN is not used for fix commits."
      - name: Upload autofix audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-agent-audit-autofix
          path: .nemesis/audit.jsonl
          if-no-files-found: ignore
