# Automated versioning.
#
# On every push to main, release-please reads the Conventional Commit
# subjects since the last release and keeps one release PR open that bumps all
# packages in lockstep (linked-versions) and rewrites the inter-package
# dependency ranges (node-workspace):
#   fix: -> patch, feat: -> minor, feat!: or a BREAKING CHANGE footer -> major
#   (chore/docs/test/ci/refactor commits do not trigger a release)
# A "Release-As: x.y.z" commit footer overrides the computed version.
#
# Merging the release PR tags the release and calls publish.yml directly. A
# release created with GITHUB_TOKEN does not trigger other workflows' events,
# so this call is the only publish path.
#
# Manual publish: workflow_dispatch publishes the current main without
# creating a release (used for the very first 0.1.0 publish).

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under (publish-only run, no release created)"
        required: false
        default: "latest"
        type: choice
        options: ["latest", "next", "beta"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.release-please.result == 'success' && needs.release-please.outputs.releases_created == 'true'))
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || 'latest' }}
    permissions:
      contents: read
      id-token: write
