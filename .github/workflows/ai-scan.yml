name: ai-scan
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./
        with:
          mode: scan
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          model-scan: ${{ vars.OLLAMA_MODEL_SCAN }}
      - name: Upload scan audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-agent-audit-scan
          path: .nemesis/audit.jsonl
          if-no-files-found: ignore
