# Release versioning reads Conventional Commit subjects (release-please), and
# squash-merged PRs use the PR title as the subject. Reject other titles.

name: PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs trusted default-branch workflow code; this job
      # only reads the PR title and never checks out PR code.
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
