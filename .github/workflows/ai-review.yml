name: ai-review
on:
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [ci-agent-review]
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: ai-review-${{ github.event.issue.number || github.event.client_payload.pr_number }}
  cancel-in-progress: true
jobs:
  review:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '/nemesis review') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'repository_dispatch' &&
        github.event.action == 'ci-agent-review' &&
        github.event.client_payload.pr_number != null
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run review using trusted default-branch code
        uses: ./
        with:
          mode: review
          pr-number: ${{ github.event.issue.number || github.event.client_payload.pr_number }}
          expected-head-sha: ${{ github.event.client_payload.head_sha || '' }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          model-review: ${{ vars.OLLAMA_MODEL_REVIEW }}
      - name: Upload review audit
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ci-agent-audit-review
          path: .nemesis/audit.jsonl
          if-no-files-found: ignore
