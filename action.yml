name: Nemesis CI Agent
description: Policy-gated PR review, failed-CI diagnosis with draft fixes, and scheduled improvement scans.
author: Nemesis OSS
inputs:
  mode:
    description: validate, review, fix, or scan
    required: false
    default: validate
  config:
    description: Policy configuration path
    required: false
    default: .nemesis/ci-agent.yml
  github-token:
    description: Scoped GitHub token. Autofix requires a GitHub App installation token.
    required: false
  ollama-api-key:
    description: Ollama Cloud API key (injected only into the agent execution step)
    required: false
  model-review:
    description: Ollama model tag for PR review
    required: false
  model-fix:
    description: Ollama model tag for autofix
    required: false
  model-scan:
    description: Ollama model tag for improvement scans
    required: false
  pr-number:
    description: Pull request number
    required: false
  expected-head-sha:
    description: Expected pull request head SHA from a trusted dispatcher event
    required: false
  workflow-run-id:
    description: Failed workflow run ID
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install and build CI agent
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --no-audit --no-fund
        npm run build
    - name: Execute CI agent
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
        INPUT_WORKFLOW_RUN_ID: ${{ inputs.workflow-run-id }}
        OLLAMA_API_KEY: ${{ inputs.ollama-api-key }}
        OLLAMA_MODEL_REVIEW: ${{ inputs.model-review }}
        OLLAMA_MODEL_FIX: ${{ inputs.model-fix }}
        OLLAMA_MODEL_SCAN: ${{ inputs.model-scan }}
      run: node "${{ github.action_path }}/dist/action.js"
